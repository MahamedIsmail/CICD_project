<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CI/CD Project</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      color: #222;
      margin: 0;
      padding: 16px;
      min-height: 100vh;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      width: 100%;
      max-width: 820px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 56px;
      box-sizing: border-box;
    }

    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      margin-bottom: 40px;
      text-align: center;
    }

    header img { width: 260px; height: auto; }

    h1 { font-size: 2.4rem; margin: 0; }

    table { width: 100%; border-collapse: collapse; font-size: 1.3rem; }

    th, td {
      text-align: left;
      padding: 18px 0;
      border-top: 1px solid #eee;
    }

    th { color: #666; font-weight: normal; width: 35%; }

    td { font-family: ui-monospace, Consolas, monospace; word-break: break-all; }

    @media (max-width: 600px) {
      main { padding: 28px; }
      header img { width: 180px; }
      h1 { font-size: 1.6rem; }
      table { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="{{ url_for('static', filename='svg/docker-logo-ocean-blue.svg') }}" alt="Docker logo">
      <h1>Hello World! I am a Docker container</h1>
    </header>

    <table>
      <tr>
        <th>Container name</th>
        <td>Small_webapp</td>
      </tr>
      <tr>
        <th>Container ID</th>
        <td>5fec97662c22f7792674a67021fd7cae.....</td>
      </tr>
      <tr>
        <th>Image</th>
        <td>small_webapp:v1.0</td>
      </tr>
    </table>
  </main>
</body>
</html>
