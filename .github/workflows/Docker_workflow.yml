# the goal build and push docker image 
# deploy to dockerhub 

name : Docker Build & Push

on: [push]

jobs:

  Docker_build:

      runs-on: ubuntu-latest

      steps:

      - name: Set up Docker 
        uses: docker/setup-docker-action@v5   # dowloads a specific version of docker and sets up the environment for it.

      - name: Login in to Docker hub 
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}      
          password: ${{secrets.DOCKERHUB_TOKEN}}
      

      - name : Build and push docker image
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ vars.DOCKER_USERNAME }}/simple-webapp:v1.0.0

      
      

      


  