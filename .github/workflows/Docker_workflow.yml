# the goal build and push docker image 
# deploy to dockerhub 

name : Docker Build & Push

on: [push]

env:
  USERNAME: ${{ vars.DOCKER_USERNAME }}
  TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  Image_name: simple-webapp:${{ github.sha }}
  subdirectory: Task_1

jobs:

  Docker_build:

      runs-on: ubuntu-latest

      steps:

      - name: Set up Docker 
        uses: docker/setup-docker-action@v5   # dowloads a specific version of docker and sets up the environment for it.

      - name: Login in to Docker hub 
        uses: docker/login-action@v4
        with: 
          username:  ${{env.USERNAME}}
          password: ${{ env.TOKEN }}

      - name : Build and push docker image
        uses: docker/build-push-action@v7
        with:
          context: " {{defaultContext}}:${{env.subdirectory}} " 
          push: true
          tags: ${{ vars.DOCKER_USERNAME }}/${{env.Image_name}} # Creates the Docker image tag using the commit ID instead of a version number.
      
      

      


  