name : Terraform_workflow

on: [push]
env:
 tfli_v: "v0.65.0"
 path: "Task_2/Terrafrom_task"

jobs:
  Terraform_lint:
    runs-on: ubuntu-latest

    steps:

    - name: check out terrafrom code
      uses: actions/checkout@v7
    - name: setup Terraform linter
      uses: terraform-linters/setup-tflint@v6
      with:
          tflint_version: ${{ env.tfli_v }} 

    - name: test version
      run: tflint -v      

    - name: Starts linter 
      run: | 
          tflint --chdir=${{env.path}} 
          TFLINT_LOG=debug tflint
          tflint --init
          

    - name: Runs Tflint
      run: tflint -f compact  

    - name: debug 
      run: |  
        pwd
        TFLINT_LOG=debug tflint
        

           

