name : Terraform_workflow.ref:main

on: [push]
env:
 tfli_v: "v0.65.0"
 path: "Task_2/Terraform_task"
jobs:
  Terraform_lint:
    runs-on: ubuntu-latest

    steps:

    - name: check out terrafrom code
      uses: actions/checkout@v7

    - name: Setup Terraform lint
      uses: terraform-linters/setup-tflint@v6
      with:
          tflint_version: ${{ env.tfli_v }} 

    - name: Test version
      run: tflint -v     

    - name: Start lint 
      run: | 
          tflint --chdir=${{env.path}} --init
          TFLINT_LOG=debug tflint --chdir=${{env.path}}

    - name: Run Tflint
      run: | 
           tflint --chdir=${{env.path}} -f compact 
           TFLINT_LOG=debug tflint --chdir=${{env.path}}


         

   


